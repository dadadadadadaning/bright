   <g id="text_12">
    <text style="font-size: 14px; font-family: 'Noto Sans CJK JP'; fill: #203348" transform="translate(271 467.685922)">所有槽均汇总同一父区域中的特征；软权重可重叠。</text>
    <text style="font-size: 14px; font-family: 'Noto Sans CJK JP'; fill: #203348" transform="translate(243.363125 487.050328)">“背景侧槽”不被强制预测为背景，零质量槽需使用有效掩膜。</text>
