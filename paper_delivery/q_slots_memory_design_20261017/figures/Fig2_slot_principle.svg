   <g id="text_10">
    <text style="font-size: 14px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #203348" x="691.2" y="312.204688" transform="rotate(-0 691.2 312.204688)">槽权重：Q×B，Q×(1−B)</text>
